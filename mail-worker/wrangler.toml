name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "db"
database_id = "01a582c4-87b8-4a1d-a6e6-cba7511af62c"

[[kv_namespaces]]
binding = "kv"
id = "6dee9e240dc54e8ea16c163eae69b59f"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]

[vars]
domain = ["garokvpn.my.id"]
admin = "admin@garokvpn.my.id"
jwt_secret = "GarokSecretKey2026"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
